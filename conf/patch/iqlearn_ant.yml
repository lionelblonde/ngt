# algo
method: "iqlearn"
# official IQ-Learn mujoco setup is one-step TD in the critic loss

# optimizer
# official mujoco scripts set this lower than the base config
actor_lr: 3e-5

# sac temperature
# official IQ-Learn IL setup uses fixed alpha (no alpha autotuning)
autotune: false
# Ant-v2 uses lower fixed alpha in official script
alpha_init: 1e-3

# iq-learn objective
# Ant-v2 in official run_mujoco.sh uses method.loss=value
iq_loss: "value"
iq_regularize: true
iq_alpha: 0.5
iq_div: null
iq_chi: false
